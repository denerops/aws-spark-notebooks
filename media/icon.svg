<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="EMR Serverless PySpark">
  <defs>
    <linearGradient id="bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2430"/>
      <stop offset="1" stop-color="#232f3e"/>
    </linearGradient>
    <linearGradient id="spark" x1="44" y1="44" x2="84" y2="92" gradientUnits="userSpaceOnUse">
