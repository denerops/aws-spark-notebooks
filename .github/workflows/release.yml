name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # Admin PAT bypasses the main ruleset so @semantic-release/git can push.
          token: ${{ secrets.GH_ADMIN_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Release
        env:
          # Must be an admin-scoped PAT (not GITHUB_TOKEN): personal repos cannot
          # add the GitHub Actions app as a ruleset bypass actor.
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx semantic-release
